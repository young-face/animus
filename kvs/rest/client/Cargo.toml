[package]
name = "animus-kvs-rest-client"
version = "0.1.0"
edition = "2024"

[dependencies]
# Internal
engine.workspace = true
kvs-api.workspace = true
kvs-rest-common.workspace = true

# External
bytes.workspace = true
csv-async = { workspace = true, features = ["tokio"] }
futures.workspace = true
futures-core.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["query", "stream"] }
serde = {
  workspace = true,
  features = [
    "derive",
  ]
}
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-test.workspace = true

[dev-dependencies]
httpmock.workspace = true
